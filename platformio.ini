; Grad no! – Abfahrtsanzeige für das "Cheap Yellow Display" (ESP32-2432S028R)
; 2,8" ILI9341 320x240 + XPT2046 Touch
;
; Erstes Flashen per USB:   pio run -t upload
; Danach Updates im Browser: http://grad-no.local -> System -> Firmware-Update
;   Datei: .pio/build/cyd/firmware.bin (oder aus den GitHub-Releases)

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; zwei OTA-Slots à 1,9 MB (Standard-Partition wäre zu knapp für TLS + Webserver)
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; ---- TFT_eSPI-Konfiguration (statt User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
